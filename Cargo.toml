[package]
name = "rhs-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum", "vendored"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
log = "0.4.33"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
dotenvy = "0.15.7"
